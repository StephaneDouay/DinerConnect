<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinanceTracker – Connexion</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f2f5;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.1);padding:40px;width:360px;max-width:95vw}
.logo{text-align:center;font-size:2rem;margin-bottom:8px}
h1{text-align:center;font-size:1.3rem;color:#1a1a2e;margin-bottom:4px}
.sub{text-align:center;color:#888;font-size:.85rem;margin-bottom:28px}
label{display:block;font-size:.85rem;font-weight:600;color:#444;margin-bottom:6px}
input{width:100%;padding:10px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:1rem;outline:none;transition:border .15s;margin-bottom:16px}
input:focus{border-color:#1a1a2e}
.btn{width:100%;padding:11px;background:#1a1a2e;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.85}
.error{background:#fee2e2;color:#b91c1c;padding:10px 14px;border-radius:8px;font-size:.88rem;margin-bottom:16px}
.hint{text-align:center;color:#aaa;font-size:.78rem;margin-top:16px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">💰</div>
  <h1>FinanceTracker</h1>
  <p class="sub">Vos finances personnelles</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST">
    <label>Mot de passe</label>
    <input type="password" name="password" placeholder="••••••••" autofocus required>
    <button type="submit" class="btn">Accéder</button>
  </form>
  <p class="hint">Mot de passe par défaut : <strong>jobtracker</strong></p>
</div>
</body>
</html>
